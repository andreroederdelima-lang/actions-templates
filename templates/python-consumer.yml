# Cole este arquivo em .github/workflows/ci.yml do seu repo Python.
# Atualiza no actions-templates → propaga.
#
# Fluxo de portões: PR pra `dev` (relaxado) → `stage` (estrito) → `main` (prod).

name: CI

on:
  pull_request:
    branches: [main, stage, dev]
  push:
    branches: [main, stage, dev]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  ci:
    uses: andreroederdelima-lang/actions-templates/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.12'
      # Strict quando promovendo pra stage ou main
      tests-strict: ${{ github.base_ref == 'stage' || github.base_ref == 'main' }}

  security:
    uses: andreroederdelima-lang/actions-templates/.github/workflows/security.yml@main
    with:
      audit-level: ${{ github.base_ref == 'main' && 'low' || 'high' }}
      codeql-language: 'python'
